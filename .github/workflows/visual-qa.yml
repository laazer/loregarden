name: Visual QA

# Renders every app surface against the seeded production-shaped sandbox and
# fails on a usability regression (client/src/lib/usabilityCheck.ts), a console
# or HTTP error, or an unreachable surface. Separate from ci.yml so it runs only
# where a surface can have changed: it costs a seeded server, a Vite client and
# a browser.
on:
  pull_request:
    paths:
      - client/src/pages/**
      - client/src/components/**
      # The check, its verdict and its route list; a change to any of them
      # changes what passes.
      - client/src/lib/usabilityCheck.ts
      - client/src/lib/visualQa*
      - client/scripts/visual-qa.mjs
      # The data it renders.
      - server/loregarden/testing/prod_shape*.py
      - scripts/sandbox.sh
      - .github/workflows/visual-qa.yml
  push:
    branches: [main]
    paths:
      - client/src/pages/**
      - client/src/components/**
      - client/src/lib/usabilityCheck.ts
      - client/src/lib/visualQa*
      - client/scripts/visual-qa.mjs
      - server/loregarden/testing/prod_shape*.py
      - scripts/sandbox.sh
      - .github/workflows/visual-qa.yml

# Same rule as ci.yml: only a pull request's superseded run is cancelled; a
# push to main keeps its run, so every commit on main is checked.
concurrency:
  group: visual-qa-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  visual-qa:
    name: Visual QA (seeded sandbox)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # Full history: the editor surface lists what the branch changed since its
      # merge-base with main, and a shallow checkout has no main to find one
      # with, so it answered 409 and failed the surface for the runner's sake.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.10

      - name: Install server dependencies
        working-directory: server
        run: uv sync

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Install Chromium
        working-directory: client
        run: npx playwright install --with-deps chromium

      # --seeded: the deterministic production shape (loregarden.testing.prod_shape);
      # there is no live database on a runner.
      - name: Start the seeded sandbox
        run: |
          # Its own session, so the last step can stop every process it started.
          setsid nohup ./scripts/sandbox.sh --seeded > "$RUNNER_TEMP/sandbox.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/sandbox.pgid"
          for _ in $(seq 1 180); do
            if curl -fsS http://127.0.0.1:8123/health > /dev/null 2>&1 &&
               curl -fsS http://127.0.0.1:5174/ > /dev/null 2>&1; then
              echo "sandbox is up"; exit 0
            fi
            sleep 1
          done
          echo "::error::the seeded sandbox did not come up within 180s"
          cat "$RUNNER_TEMP/sandbox.log"
          exit 1

      # Exit 1 is a real failure. Exit 3 means nothing failed but a surface never
      # settled within its budget even after a retry, so it went unchecked: that
      # is the runner being slow, which must not fail the gate as if a surface
      # were unusable. It is still said, as a warning naming the surfaces.
      - name: Run visual QA
        working-directory: client
        run: |
          set +e
          npm run visual-qa -- --base-url http://127.0.0.1:5174 --out "$GITHUB_WORKSPACE/.visual-qa"
          status=$?
          set -e
          if [ "$status" -eq 3 ]; then
            unsettled=$(node -e 'console.log(require(process.argv[1]).unsettled.join(", "))' "$GITHUB_WORKSPACE/.visual-qa/summary.json")
            echo "::warning title=Visual QA inconclusive::never settled, so unchecked (load, not a usability failure): $unsettled"
            exit 0
          fi
          exit "$status"

      - name: Upload screenshots and summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-qa
          path: .visual-qa
          if-no-files-found: warn

      - name: Show the sandbox log
        if: failure()
        run: cat "$RUNNER_TEMP/sandbox.log"

      # The sandbox runs under `uv run`, which holds uv's cache lock while it lives.
      # On a cache miss setup-uv's post step prunes the cache, waits on that lock for
      # UV_LOCK_TIMEOUT (300s) and fails the job, so the cache is never saved and
      # every later run misses again. Stop it before the post steps run.
      - name: Stop the sandbox
        if: always()
        run: |
          [ -f "$RUNNER_TEMP/sandbox.pgid" ] || exit 0
          pgid=$(cat "$RUNNER_TEMP/sandbox.pgid")
          kill -TERM -- "-$pgid" 2>/dev/null || exit 0
          for _ in $(seq 1 20); do
            kill -0 -- "-$pgid" 2>/dev/null || { echo "sandbox stopped"; exit 0; }
            sleep 1
          done
          echo "::warning::the sandbox ignored SIGTERM for 20s; killing it"
          kill -KILL -- "-$pgid" 2>/dev/null || true
