name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      # Full history: test_migration_registry compares the registered ids with
      # the ones origin/main shipped at this branch's merge-base.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.10

      - name: Install dependencies
        run: uv sync --extra dev

      # test_gate_scope_visibility.py drives the real ts_organization_check.cjs,
      # which parses with @typescript-eslint/typescript-estree from
      # client/node_modules. Without this, its ten [ts-org] params skipped here
      # and the gate had no enforced coverage in either job.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies (the TypeScript gate parses with them)
        working-directory: client
        run: npm ci

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      # `ruff check .` from server/ never reaches the stdlib scripts outside
      # it (.claude/hooks, .lefthook/scripts, .github/scripts), which run
      # under the system python3 — see .lefthook/scripts/py-staged-paths.sh.
      - name: Ruff lint + format check (scripts outside server/)
        run: |
          bash ../.lefthook/scripts/py-scripts-ruff.sh check
          bash ../.lefthook/scripts/py-scripts-ruff.sh format --check

      - name: Pytest
        run: uv run pytest -q -n auto
        env:
          LOREGARDEN_REPO_ROOT: ${{ github.workspace }}
          # Profiling rides on the run that was happening anyway; the artifact
          # names the slowest tests so a slower suite can be attributed.
          LORE_EDEN_PROFILE: ${{ github.workspace }}/.profile/server.json

      - name: Upload the server suite's profile
        # `always()`: a run that failed part way is exactly when the timings of
        # what did run are worth having.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profile-server
          path: .profile/server.json
          if-no-files-found: error

  client:
    name: Client (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc -b

      - name: Test
        run: npm test
