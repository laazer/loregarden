name: CI

on:
  push:
    branches: [main, staging, trying]
  pull_request:

# Cancel a superseded run only on a pull request, whose branch is disposable.
# A push to main/staging/trying is a commit on a shared branch: cancelling its
# run when the next commit arrives leaves that commit with no evidence at all,
# so landing N changes in a row yields one green check and N-1 blanks
# (lg-milestone-that-492 AC5).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  already-tested:
    name: Already tested
    # Only where a landed commit can repeat the queue's run. Skipped elsewhere,
    # which leaves its output empty and the suite running.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      checks: read
    outputs:
      reused: ${{ steps.tree.outputs.reused }}
    steps:
      - uses: actions/checkout@v4

      - name: Look for a run that passed on this tree
        id: tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 .github/scripts/tested_tree.py --repo "$GITHUB_REPOSITORY"
          --sha "$GITHUB_SHA" --output "$GITHUB_OUTPUT"

  server-lint:
    name: Server lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.10

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      # `ruff check .` from server/ never reaches the stdlib scripts outside
      # it (.claude/hooks, .lefthook/scripts, .github/scripts), which run
      # under the system python3 — see .lefthook/scripts/py-staged-paths.sh.
      - name: Ruff lint + format check (scripts outside server/)
        run: |
          bash ../.lefthook/scripts/py-scripts-ruff.sh check
          bash ../.lefthook/scripts/py-scripts-ruff.sh format --check

  server-tests:
    name: Server tests (${{ matrix.shard }})
    needs: already-tested
    # `!cancelled()`: without a status function a skipped need skips this job too.
    if: ${{ !cancelled() && needs.already-tested.outputs.reused != 'true' }}
    runs-on: ubuntu-latest
    # The whole suite took 18-28 minutes on one runner (28 runs, 2026-11-23).
    # Without a limit a hung suite, or a runner that went away, holds the merge
    # queue for an hour.
    timeout-minutes: 30
    strategy:
      # Off: a runner that dies would cancel its siblings, which would then read
      # as failures and not as results nobody has yet.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: server
    steps:
      # Full history: test_migration_registry compares the registered ids with
      # the ones origin/main shipped at this branch's merge-base.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.10

      - name: Install dependencies
        run: uv sync --extra dev

      # test_gate_scope_visibility.py drives the real ts_organization_check.cjs,
      # which parses with @typescript-eslint/typescript-estree from
      # client/node_modules. Without this, its ten [ts-org] params skipped here
      # and the gate had no enforced coverage in either job.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies (the TypeScript gate parses with them)
        working-directory: client
        run: npm ci

      # A runner can stop for minutes: on 2026-11-23 all four workers stalled at
      # once and the four tests they held failed the 120s ceiling together, at
      # 182-187s. 300s outlasts that and still names a hang.
      - name: Pytest
        run: |
          files=$(python3 ../.github/scripts/pytest_shard.py \
            --shard ${{ matrix.shard }} --of ${{ strategy.job-total }})
          uv run pytest -q -n auto --timeout 300 $files
        env:
          LOREGARDEN_REPO_ROOT: ${{ github.workspace }}
          # Profiling rides on the run that was happening anyway; the artifact
          # names the slowest tests so a slower suite can be attributed.
          LORE_EDEN_PROFILE: ${{ github.workspace }}/.profile/server.json

      - name: Upload the server suite's profile
        # `always()`: a run that failed part way is exactly when the timings of
        # what did run are worth having.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profile-server-${{ matrix.shard }}
          path: .profile/server.json
          if-no-files-found: error

  # The check main's ruleset requires by name. `always()` with no `!cancelled()`:
  # a skipped required check counts as passed, so a cancelled run has to end in a
  # failed one. Its step is named GATHER_STEP (services/merge_queue_failures.py),
  # which is how the queue knows this job has no verdict of its own.
  server:
    name: Server (Python)
    needs: [already-tested, server-lint, server-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All required jobs passed
        env:
          LINT: ${{ needs.server-lint.result }}
          TESTS: ${{ needs.server-tests.result }}
          REUSED: ${{ needs.already-tested.outputs.reused }}
        run: |
          echo "lint: $LINT; tests: $TESTS; reused: ${REUSED:-false}"
          [ "$LINT" = "success" ] || exit 1
          # Skipped only where these tests already passed on this tree.
          case "$TESTS" in
            success) ;;
            skipped) [ "$REUSED" = "true" ] || exit 1 ;;
            *) exit 1 ;;
          esac

  client:
    name: Client (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc -b

      # Whole-tree, so it is here and not among the PR-diff gates: what strands a
      # module is usually an import removed somewhere else.
      - name: Unreachable modules
        run: node ../.lefthook/scripts/ts_unreachable_check.cjs --repo .. --scope branch

      - name: Test
        run: npm test

  gates:
    name: Workspace gates (PR diff)
    # Pre-commit runs these, but only where lefthook is installed: #595 was
    # committed somewhere it was not and grew enums.py past the 1500-line cap on
    # main, which every later branch then inherited (956). Graded on the PR's
    # own diff from its merge base, so content it did not touch never fails it.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.10

      - name: Install server dependencies (the Python gates run in its environment)
        working-directory: server
        run: uv sync --extra dev

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies (the TypeScript gates parse with them)
        working-directory: client
        run: npm ci

      # Exit 69 (a gate could not run) fails the job too: an ungraded diff is
      # not a passing one.
      - name: Run the workspace gates on the PR's diff
        env:
          BASE: origin/${{ github.base_ref }}
        run: bash .lefthook/scripts/workspace-gates.sh --repo . --scope branch --base "$BASE"

  ci:
    name: CI
    needs: [server, client, gates]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs passed
        run: |
          if [ "${{ needs.server.result }}" != "success" ] || [ "${{ needs.client.result }}" != "success" ]; then
            exit 1
          fi
          # Skipped only on a push, where there is no PR diff to grade.
          case "${{ needs.gates.result }}" in
            success) ;;
            skipped) [ "${{ github.event_name }}" != "pull_request" ] || exit 1 ;;
            *) exit 1 ;;
          esac
