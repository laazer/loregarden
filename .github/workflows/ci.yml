name: CI

on:
  push:
    branches: [main, staging, trying]
  pull_request:

# Cancel a superseded run only on a pull request, whose branch is disposable.
# A push to main/staging/trying is a commit on a shared branch: cancelling its
# run when the next commit arrives leaves that commit with no evidence at all,
# so landing N changes in a row yields one green check and N-1 blanks
# (lg-milestone-that-492 AC5).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  already-tested:
    name: Already tested
    # Only where a landed commit can repeat the queue's run. Skipped elsewhere,
    # which leaves its output empty and the suite running.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      checks: read
    outputs:
      reused: ${{ steps.tree.outputs.reused }}
    steps:
      - uses: actions/checkout@v4

      - name: Look for a run that passed on this tree
        id: tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 .github/scripts/tested_tree.py --repo "$GITHUB_REPOSITORY"
          --sha "$GITHUB_SHA" --output "$GITHUB_OUTPUT"

  server-lint:
    name: Server lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.10

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      # `ruff check .` from server/ never reaches the stdlib scripts outside
      # it (.claude/hooks, .lefthook/scripts, .github/scripts), which run
      # under the system python3 — see .lefthook/scripts/py-staged-paths.sh.
      - name: Ruff lint + format check (scripts outside server/)
        run: |
          bash ../.lefthook/scripts/py-scripts-ruff.sh check
          bash ../.lefthook/scripts/py-scripts-ruff.sh format --check

  server-tests:
    name: Server tests (${{ matrix.shard }})
    needs: already-tested
    # `!cancelled()`: without a status function a skipped need skips this job too.
    if: ${{ !cancelled() && needs.already-tested.outputs.reused != 'true' }}
    runs-on: ubuntu-latest
    # The whole suite took 18-28 minutes on one runner (28 runs, 2026-11-23).
    # Without a limit a hung suite, or a runner that went away, holds the merge
    # queue for an hour.
    timeout-minutes: 30
    strategy:
      # Off: a runner that dies would cancel its siblings, which would then read
      # as failures and not as results nobody has yet.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: server
    steps:
      # Full history: test_migration_registry compares the registered ids with
      # the ones origin/main shipped at this branch's merge-base.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.10

      - name: Install dependencies
        run: uv sync --extra dev

      # test_gate_scope_visibility.py drives the real ts_organization_check.cjs,
      # which parses with @typescript-eslint/typescript-estree from
      # client/node_modules. Without this, its ten [ts-org] params skipped here
      # and the gate had no enforced coverage in either job.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies (the TypeScript gate parses with them)
        working-directory: client
        run: npm ci

      # A runner can stop for minutes: on 2026-11-23 all four workers stalled at
      # once and the four tests they held failed the 120s ceiling together, at
      # 182-187s. 300s outlasts that and still names a hang.
      # The shard's wall time is written whatever pytest exits with: the Suite time
      # check holds every shard, and all of them summed, to a 30-minute ceiling.
      - name: Pytest
        run: |
          files=$(python3 ../.github/scripts/pytest_shard.py \
            --shard ${{ matrix.shard }} --of ${{ strategy.job-total }})
          started=$(date +%s)
          set +e
          uv run pytest -q -n auto --timeout 300 $files
          code=$?
          set -e
          mkdir -p ../.profile
          echo "{\"wall_seconds\": $(( $(date +%s) - started ))}" > ../.profile/server-wall.json
          exit $code
        env:
          LOREGARDEN_REPO_ROOT: ${{ github.workspace }}
          # Profiling rides on the run that was happening anyway; the artifact
          # names the slowest tests so a slower suite can be attributed.
          LORE_EDEN_PROFILE: ${{ github.workspace }}/.profile/server.json

      - name: Upload the server suite's profile
        # `always()`: a run that failed part way is exactly when the timings of
        # what did run are worth having.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profile-server-${{ matrix.shard }}
          path: |
            .profile/server.json
            .profile/server-wall.json
          if-no-files-found: error

  # The check main's ruleset requires by name. `always()` with no `!cancelled()`:
  # a skipped required check counts as passed, so a cancelled run has to end in a
  # failed one. Its step is named GATHER_STEP (services/merge_queue_failures.py),
  # which is how the queue knows this job has no verdict of its own.
  server:
    name: Server (Python)
    needs: [already-tested, server-lint, server-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All required jobs passed
        env:
          LINT: ${{ needs.server-lint.result }}
          TESTS: ${{ needs.server-tests.result }}
          REUSED: ${{ needs.already-tested.outputs.reused }}
        run: |
          echo "lint: $LINT; tests: $TESTS; reused: ${REUSED:-false}"
          [ "$LINT" = "success" ] || exit 1
          # Skipped only where these tests already passed on this tree.
          case "$TESTS" in
            success) ;;
            skipped) [ "$REUSED" = "true" ] || exit 1 ;;
            *) exit 1 ;;
          esac

  client:
    name: Client (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc -b

      # Whole-tree, so it is here and not among the PR-diff gates: what strands a
      # module is usually an import removed somewhere else.
      - name: Unreachable modules
        run: node ../.lefthook/scripts/ts_unreachable_check.cjs --repo .. --scope branch

      # Per-file timings for the suite-timing job; jest still prints its usual
      # report, and writes the file whether or not the tests passed. jest does not
      # create the file's directory: without the mkdir it fails after a green run.
      - name: Test
        run: |
          mkdir -p ../.profile
          npm test -- --json --outputFile=../.profile/client-jest.json

      - name: Upload the client suite's timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profile-client
          path: .profile/client-jest.json
          if-no-files-found: error

  # Per-file test time on every run, and on a pull request a check that fails when
  # a suite grew more than 20% over the median of main's last ten runs, naming
  # the files that grew. The arithmetic is lore_eden.testing.profile_delta;
  # .github/scripts/suite_timing.py decides which runs it sees. Main's pushes
  # store the baseline; nothing a pull request uploads is read as one.
  suite-timing:
    name: Suite time (vs main)
    needs: [server-tests, client]
    # A failed suite's profiles are still recorded (and never baselined), and a
    # skipped one (main reusing a tested tree) is carried from the run that tested it.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.10

      - name: Install dependencies (lore-eden's profile_delta)
        working-directory: server
        run: uv sync

      - name: Download the suites' profiles
        uses: actions/download-artifact@v4
        with:
          pattern: profile-*
          path: .profile

      - name: Collect this run's profiles
        run: >-
          uv run --project server python .github/scripts/suite_timing.py collect
          --profiles .profile --client-root "$GITHUB_WORKSPACE/client" --out .timing/run
          --repo "$GITHUB_REPOSITORY" --sha "$GITHUB_SHA" --event "$GITHUB_EVENT_NAME"
          --ref "$GITHUB_REF"

      - name: Upload this run's profiles
        uses: actions/upload-artifact@v4
        with:
          name: suite-profiles
          path: .timing/run/
          if-no-files-found: error
          retention-days: 90

      - name: Store main's baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: >-
          uv run --project server python .github/scripts/suite_timing.py baseline
          --repo "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" --current .timing/run
          --work .timing/main --out .timing/baseline/baseline.json

      - name: Upload main's baseline
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: suite-timing-baseline
          path: .timing/baseline/baseline.json
          if-no-files-found: error
          retention-days: 90

      - name: Compare with main's baseline
        if: github.event_name == 'pull_request'
        run: >-
          uv run --project server python .github/scripts/suite_timing.py check
          --repo "$GITHUB_REPOSITORY" --current .timing/run --work .timing/fetched
          --summary "$GITHUB_STEP_SUMMARY"

      # A hard ceiling, not a trend: every shard's pytest wall time, and all shards
      # together (about what one runner would take), must stay within 30 minutes.
      - name: Server wall time (30-minute ceiling)
        if: ${{ !cancelled() }}
        run: >-
          uv run --project server python .github/scripts/suite_timing.py ceiling
          --profiles .profile

  gates:
    name: Workspace gates (PR diff)
    # Pre-commit runs these, but only where lefthook is installed: #595 was
    # committed somewhere it was not and grew enums.py past the 1500-line cap on
    # main, which every later branch then inherited (956). Graded on the PR's
    # own diff from its merge base, so content it did not touch never fails it.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.10

      - name: Install server dependencies (the Python gates run in its environment)
        working-directory: server
        run: uv sync --extra dev

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies (the TypeScript gates parse with them)
        working-directory: client
        run: npm ci

      # Exit 69 (a gate could not run) fails the job too: an ungraded diff is
      # not a passing one.
      - name: Run the workspace gates on the PR's diff
        env:
          BASE: origin/${{ github.base_ref }}
        run: bash .lefthook/scripts/workspace-gates.sh --repo . --scope branch --base "$BASE"

  ci:
    name: CI
    needs: [server, client, gates]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs passed
        run: |
          if [ "${{ needs.server.result }}" != "success" ] || [ "${{ needs.client.result }}" != "success" ]; then
            exit 1
          fi
          # Skipped only on a push, where there is no PR diff to grade.
          case "${{ needs.gates.result }}" in
            success) ;;
            skipped) [ "${{ github.event_name }}" != "pull_request" ] || exit 1 ;;
            *) exit 1 ;;
          esac
