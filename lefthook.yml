# Git hooks for loregarden (FastAPI control plane + React/Tauri desktop app).
# Install:  lefthook install
# Skip:     LEFTHOOK=0 git commit / git push
# Agent/CI: bash hooks source .lefthook/scripts/hook-noninteractive.sh (no prompts).
#
# Adapted from the blobert project's lefthook setup, retargeted at loregarden's
# single Python root (server/) and React/oxlint client (client/), and scoped to
# match .github/workflows/ci.yml — with one deliberate exception: pre-push runs
# only the tests the pushed commits reach (see below).
#
# pre-commit — format first, alone; then the checks, in parallel:
#   - format-staged: ruff format/fix (Python); oxlint --fix (client)
#   - py-review / py-pylint / py-complexity / py-organization / py-silent-except / …
#   - py-mypy: mypy on staged server Python (skips tests + migrations)
#   - client-lint / client-dup (jscpd) / ts-organization
#
# format-staged is the first job and the checks are a parallel group after it,
# so they see the tree it restaged. (`priority` cannot do this: lefthook orders
# by it only when a hook is not parallel.)
#
# pre-push — the CI jobs, with the test runners narrowed, one after the other:
#   - server-tests: ruff check, ruff format --check (full), then pytest on the
#     test files that reach the pushed changes through the import graph
#   - client-tests: oxlint, tsc -b (full), then jest --changedSince
#   - Both test runners stop at the first failure (pytest -x / jest --bail). The
#     first failure is the one worth reading — a cascade dominates the output and
#     picks the wrong suspect — and it bounds what a broken push costs on a
#     loaded box. CI runs to completion, so the full count is never lost.
#   - Both fall back to the full suite for any change they cannot map, and CI
#     still runs everything on every PR — a green push predicts CI, it no longer
#     proves it. LOREGARDEN_FULL_TESTS=1 runs the full suites here.
#   - They run one after the other, NOT in parallel. server-tests is an xdist
#     run that takes every core it can get; jest sharing those cores with it
#     lost roughly 2x on wall-clock, and the stress tests that inherit jest's
#     default 5000 ms timeout then failed on time rather than on behaviour —
#     rejecting pushes whose diff never touched the client. Sequential costs a
#     few minutes; the parallel version cost a false failure per push under
#     load. See lg-workflow-integrity-621.
#   - Opt-out: LEFTHOOK=0 skips all hooks; LEFTHOOK_EXCLUDE=<job> skips one job
#
# Requires:
#   - server/.venv (or uv on PATH) — see server/pyproject.toml; uv sync
#   - client/node_modules (or npm on PATH) — cd client && npm ci

# `**/` matches zero directories or more. lefthook's default matcher reads it
# as one or more, so `client/src/**/*.tsx` skipped client/src/App.tsx,
# `client/**/*.json` skipped client/package.json (a dependency-only push ran no
# jest), and every gate on `client/**/*.ts` skipped client/vite.config.ts.
# server/tests/test_lefthook_globs.py holds this setting.
glob_matcher: doublestar

# A passing gate prints one summary line; a failing gate prints its full output.
# A green commit used to print ~4 KB of box art and every gate's success log,
# which an agent paid for on every commit. This lives here, not in a config
# picked by LEFTHOOK_CONFIG: that variable reaches every repo a session commits
# in, and in one without the named file lefthook skips every hook and exits 0.
output:
  - summary
  - failure

pre-commit:
  # Sequential, then parallel. format-staged runs alone first and restages
  # what it fixed; only then do the checks run, in parallel, on the formatted
  # tree. These were one parallel `commands` map whose `priority` was meant to
  # run format first, but lefthook orders by priority only when NOT parallel,
  # so every check raced the formatter and an import order ruff fixes failed
  # the commit. server/tests/test_lefthook_hook_order.py holds this.
  jobs:
    - name: format-staged
      # Format staged (ruff / oxlint --fix)
      glob: "{server/**/*.py,.claude/hooks/*.py,.lefthook/scripts/*.py,.github/scripts/*.py,client/**/*.{ts,tsx,js,jsx}}"
      run: bash .lefthook/scripts/format-staged.sh {staged_files}
      stage_fixed: true
    - name: checks
      group:
        parallel: true
        jobs:
          - name: registry-checks
            # Registry checks (whole-tree tests pre-push selection cannot reach)
            # "A new X must be registered in Y" rules: tests that walk the tree, so
            # neither the import graph nor `jest --changedSince` selects them from the
            # file you changed. Tests opt in where they are written; see the script.
            glob: "{AGENTS.md,server/loregarden/**/*.py,server/tests/**/*.py,client/src/**/*.{ts,tsx,css,json}}"
            run: bash .lefthook/scripts/registry-checks.sh {staged_files}
          - name: py-review
            # Python (Ruff, server/pyproject.toml)
            # Python outside server/ that the gates own: Claude Code hooks, the gate
            # scripts, CI's helper scripts — stdlib-only, run by the system python3.
            # Same directories as PY_SCRIPT_DIRS in .lefthook/scripts/py-staged-paths.sh,
            # which is what maps them through to the tool; a glob alone checks nothing.
            glob: "{server/**/*.py,.claude/hooks/*.py,.lefthook/scripts/*.py,.github/scripts/*.py}"
            run: bash .lefthook/scripts/py-review.sh {staged_files}
          - name: py-pylint
            # Python (Pylint too-many-statements)
            glob: "{server/**/*.py,.claude/hooks/*.py,.lefthook/scripts/*.py,.github/scripts/*.py}"
            run: bash .lefthook/scripts/py-pylint.sh {staged_files}
          - name: py-complexity
            # Python (Ruff C901 McCabe complexity)
            glob: "{server/**/*.py,.claude/hooks/*.py,.lefthook/scripts/*.py,.github/scripts/*.py}"
            run: bash .lefthook/scripts/py-complexity.sh {staged_files}
          - name: py-organization
            # Python organization guardrails
            # The gate scripts are graded by the rules they enforce. Everything
            # under .lefthook/scripts/ was outside every glob, so a violation planted
            # in a gate went undetected by the gate itself.
            glob: "{server/**/*.py,.claude/hooks/*.py,.lefthook/scripts/*.py,.github/scripts/*.py}"
            run: bash .lefthook/scripts/server_python.sh .lefthook/scripts/py_organization_check.py {staged_files}
          - name: py-defensive-normalization
            # Python defensive normalization check (code smell)
            glob: "{server/**/*.py,.claude/hooks/*.py,.lefthook/scripts/*.py,.github/scripts/*.py}"
            run: bash .lefthook/scripts/detect-defensive-normalization.sh {staged_files}
          - name: py-silent-except
            # Python silently-caught exceptions
            # The gate scripts are graded by the rules they enforce. Everything
            # under .lefthook/scripts/ was outside every glob, so a violation planted
            # in a gate went undetected by the gate itself.
            glob: "{server/**/*.py,.claude/hooks/*.py,.lefthook/scripts/*.py,.github/scripts/*.py}"
            run: bash .lefthook/scripts/server_python.sh .lefthook/scripts/py_silent_except_check.py {staged_files}
          - name: md-report
            # Report markdown written into the tree
            glob: "{*.md,**/*.md}"
            run: bash .lefthook/scripts/server_python.sh .lefthook/scripts/md_report_check.py {staged_files}
          - name: py-git-subprocess
            # Python git subprocess routing (GIT_DIR safety)
            glob: "{server/**/*.py,.claude/hooks/*.py,.lefthook/scripts/*.py,.github/scripts/*.py}"
            run: bash .lefthook/scripts/server_python.sh .lefthook/scripts/py_git_subprocess_check.py {staged_files}
          - name: py-ref-writers
            # Python branch moves outside integration_branch_moves
            glob: "{server/**/*.py,.claude/hooks/*.py,.lefthook/scripts/*.py,.github/scripts/*.py}"
            run: bash .lefthook/scripts/server_python.sh .lefthook/scripts/py_ref_writers_check.py {staged_files}
          - name: py-mypy
            # Python (mypy, staged files)
            glob: "{server/**/*.py,.claude/hooks/*.py,.lefthook/scripts/*.py,.github/scripts/*.py}"
            run: bash .lefthook/scripts/mypy-changed.sh {staged_files}
          - name: client-lint
            # Client (oxlint)
            glob: "client/**/*.{ts,tsx,js,jsx}"
            run: bash .lefthook/scripts/client-lint.sh {staged_files}
          - name: client-dup
            # Client duplication (jscpd)
            glob: "client/src/**/*.{ts,tsx}"
            run: bash .lefthook/scripts/client-dup-check.sh {staged_files}
          - name: ts-organization
            # TypeScript organization guardrails
            glob: "client/**/*.{ts,tsx}"
            run: bash .lefthook/scripts/ts-organization.sh {staged_files}
          - name: ts-silent-failures
            # TypeScript silent failure check (swallowed rejections)
            glob: "client/**/*.{ts,tsx}"
            run: bash .lefthook/scripts/ts-silent-failures.sh {staged_files}
          - name: ts-ux-states
            # TypeScript user-experience check (naming, keyboard, empty states, agent-drivable)
            glob: "client/**/*.{ts,tsx}"
            run: bash .lefthook/scripts/ts-ux-states.sh {staged_files}
          - name: ts-theme
            # Theme check (raw form controls, hardcoded colours, OS colour-scheme branches)
            glob: "client/**/*.{ts,tsx,css}"
            run: bash .lefthook/scripts/ts-theme.sh {staged_files}
          - name: ts-type
            # Type scale check (hardcoded font sizes off the --fs-* steps)
            glob: "client/**/*.{ts,tsx,css}"
            run: bash .lefthook/scripts/ts-type.sh {staged_files}
          - name: ts-motion
            # Motion check (layout-property animation, hardcoded durations, reduced-motion policy)
            glob: "client/**/*.css"
            run: bash .lefthook/scripts/ts-motion.sh {staged_files}

# commit-msg — the one hook that sees both a merge's result and its message:
#   - merge-drops: a merge concluded by hand may not delete a file only its own
#     branch added (8ee19bc68 dropped lg-milestone-that-1316's landing that way)
#     unless the message names it: `Drops: <path> — <why>`. Not a merge: no-op.
commit-msg:
  commands:
    merge-drops:
      name: A merge keeps the files its own branch added
      run: bash .lefthook/scripts/server_python.sh .lefthook/scripts/merge_drops_check.py --msg-file {1}

pre-push:
  # Deliberately sequential — see the note above. Do not restore `parallel: true`
  # without capping both runners' worker counts so they fit on the box together.
  parallel: false
  # Stream output as it happens: a push queued for capacity prints its place in
  # line, and buffered until exit that reads exactly like a hang.
  follow: true
  # A list, not a `commands` map: lefthook runs a map's commands in name order
  # (client-tests, server-tests, signed-commits), so the signature check meant
  # to refuse an unsigned commit first ran after both suites. A jobs list runs
  # in the order written. server/tests/test_lefthook_hook_order.py holds it.
  jobs:
    # First and cheap: a git read per pushed commit, no capacity lease. An
    # unsigned commit is refused before the test suites spend minutes on it.
    - name: signed-commits
      # Every pushed commit is signed
      use_stdin: true
      run: bash .lefthook/scripts/signed-commits.sh
    # Each runs under a host-capacity lease (capacity-run.sh), so pushes from
    # every repo on this machine queue instead of piling on; the grant sets the
    # worker count. `interactive` hands the terminal to the wrapper's
    # proceed/retry/stop prompt when the ledger cannot be reached.
    - name: server-tests
      # Server tests (ruff full + pytest on reached tests)
      # The script directories too: their ruff runs here, and their tests live
      # in server/tests (select_pytest_targets.py selects the tests naming them).
      glob: "{server/**/*.py,.claude/hooks/*.py,.lefthook/scripts/*.py,.github/scripts/*.py}"
      skip:
        - run: bash .lefthook/scripts/staged-push.sh server-tests
      interactive: true
      run: >-
        bash .lefthook/scripts/capacity-run.sh "pre-push server-tests"
        --footprint heavy --workspace loregarden
        -- bash .lefthook/scripts/server-tests.sh
    # `stack` (2 cpus / 4 GB), not `heavy`: on a 7-cpu host pool a heavy client
    # run can never sit beside another push's heavy server suite, so a ~30s
    # jest run waited out a 15-45 minute one. Measured 2026-10-03, full run:
    # 83s at 4 workers, 132s at 2, peak 2.6-2.9 GB; at 2 workers beside a full
    # 4-worker server suite, 294s and green, no timeouts. The queue is strictly
    # first-come, first-served, so this pays off when a client run reaches the
    # head while a server suite holds. test_prepush_footprints_share_the_host
    # checks the fit.
    - name: client-tests
      # Client tests (oxlint + tsc full + jest --changedSince)
      glob: "client/**/*.{ts,tsx,js,jsx,json}"
      skip:
        - run: bash .lefthook/scripts/staged-push.sh client-tests
      interactive: true
      run: >-
        bash .lefthook/scripts/capacity-run.sh "pre-push client-tests"
        --footprint stack --workspace loregarden
        -- bash .lefthook/scripts/client-tests.sh

# Dependency sync: a pull, merge, rebase or branch switch that changes
# server/uv.lock, server/pyproject.toml or client/package-lock.json re-runs
# `uv sync` / `npm ci` (.lefthook/scripts/sync-deps.sh). Without it a pull left
# the venv on the old lock, and the next dev-server reload died at import.
post-merge:
  commands:
    sync-deps:
      name: Sync dependencies a merge changed
      run: bash .lefthook/scripts/sync-deps.sh merge

# lefthook substitutes {N} in `run` but not in `skip`, so the script reads the
# hook's arguments itself: post-checkout's third is 1 for a branch switch and 0
# for `git checkout -- <file>`; post-rewrite's first is "rebase" or "amend".
post-checkout:
  commands:
    sync-deps:
      name: Sync dependencies a branch switch changed
      run: bash .lefthook/scripts/sync-deps.sh checkout {1} {2} {3}

post-rewrite:
  commands:
    sync-deps:
      name: Sync dependencies a rebase changed
      run: bash .lefthook/scripts/sync-deps.sh rewrite {1}
