slug: blobert
name: Blobert Godot TDD
driver: builtin_autopilot
workflow_template: blobert-tdd
orchestrator:
  skill: autopilot
  pipeline: agents/common_assets/pipeline_stages_v1.md
gates:
  enabled: true
  transition_script: ci/scripts/run_workflow_transition_gates.py
  # Blobert keeps its own gate registry in ci/scripts; these are loregarden's,
  # invoked from loregarden's tree so the rules stay in one place instead of being
  # copied into every workspace. All auto-detect this repo's layout — blobert's
  # Python lives under asset_generation/, not server/.
  commands:
    - bash {loregarden_root}/.lefthook/scripts/workspace-gates.sh --repo {workspace_root} --scope worktree
subagents:
  spawn_via: cli
callbacks:
  mode: api
max_stages_per_run: 0
git:
  # Commit and push finished work, and open a tree's PR to `main` (958). With
  # every switch off, nothing ever published a blobert tree: blob-procedural-sdf-14
  # held 31 commits and blob-rust-terrain-108 22 that existed only locally when
  # they began conflicting with `main` (2026-10-13). A tree now publishes after
  # every landing on its integration branch, so it never drifts that far again.
  #
  # `commit`/`push` also publish an acting chat turn's branch, as loregarden's do.
  commit: true
  push: true
  tree_open_pr: true
  # Off on purpose. blobert is private on a GitHub plan with no rulesets and no
  # branch protection, so `gh pr merge --auto` has no required checks to wait
  # behind and would merge at once, untested (loregarden PR #150, 2026-08-12, is
  # that failure). Turn this on only once `main` requires CI checks.
  tree_auto_merge: false
