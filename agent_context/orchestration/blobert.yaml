slug: blobert
name: Blobert Godot TDD
driver: builtin_autopilot
workflow_template: blobert-tdd
orchestrator:
  skill: autopilot
  pipeline: agents/common_assets/pipeline_stages_v1.md
gates:
  enabled: true
  transition_script: ci/scripts/run_workflow_transition_gates.py
  # Blobert keeps its own gate registry in ci/scripts; these are loregarden's,
  # invoked from loregarden's tree so the rules stay in one place instead of being
  # copied into every workspace. All auto-detect this repo's layout — blobert's
  # Python lives under asset_generation/, not server/.
  commands:
    - bash {loregarden_root}/.lefthook/scripts/server_python.sh {loregarden_root}/.lefthook/scripts/py_organization_check.py --repo {workspace_root} --scope worktree
    - bash {loregarden_root}/.lefthook/scripts/server_python.sh {loregarden_root}/.lefthook/scripts/py_silent_except_check.py --repo {workspace_root} --scope worktree
    - node {loregarden_root}/.lefthook/scripts/ts_organization_check.cjs --repo {workspace_root} --scope worktree
subagents:
  spawn_via: cli
callbacks:
  mode: api
max_stages_per_run: 0
