slug: loregarden
name: Loregarden Builtin Autopilot
driver: builtin_autopilot
workflow_template: loregarden-tdd
orchestrator:
  skill: autopilot
  pipeline: agents/common_assets/pipeline_stages_v1.md
gates:
  enabled: true
  # Static-analysis gate: each check is paired with a fixer of the same name in
  # autofix_commands below, so a failure the fixer can resolve never reaches a
  # human. Commands run from the workspace root via `bash -c` so they find the
  # per-subproject tooling (uv-managed venv for server/, node_modules for client/).
  #
  # `npx --no-install` on the client checks, deliberately. A ticket runs in a
  # git worktree and node_modules is gitignored, so no worktree has one — plain
  # `npx` then tries to fetch oxlint over the network on every gate and blows
  # the 300s budget. --no-install turns that into an immediate "not installed",
  # which the runner classifies UNAVAILABLE and routes to a human instead of
  # spending an agent attempt on a toolchain no agent can install.
  commands:
    - bash -c "cd server && uv run ruff check ."
    - bash -c "cd server && uv run ruff format --check ."
    - bash -c "cd client && npx --no-install oxlint ."
    # Organization and silent-exception guardrails. Same checks the pre-commit
    # hook runs, scoped to the working tree because an agent's edits are
    # uncommitted when this fires. No fixer pairs with these: naming a
    # vocabulary, modelling a payload, or deciding how a failure should surface
    # is a design decision, so a failure goes straight to the stage's own agent.
    - bash {loregarden_root}/.lefthook/scripts/server_python.sh {loregarden_root}/.lefthook/scripts/py_organization_check.py --repo {workspace_root} --scope worktree
    - bash {loregarden_root}/.lefthook/scripts/server_python.sh {loregarden_root}/.lefthook/scripts/py_silent_except_check.py --repo {workspace_root} --scope worktree
    - node {loregarden_root}/.lefthook/scripts/ts_organization_check.cjs --repo {workspace_root} --scope worktree
    - node {loregarden_root}/.lefthook/scripts/ts_no_silent_failures_check.cjs --repo {workspace_root} --scope worktree
    - node {loregarden_root}/.lefthook/scripts/ts_ux_states_check.cjs --repo {workspace_root} --scope worktree
  autofix_commands:
    - bash -c "cd server && uv run ruff check --fix ."
    - bash -c "cd server && uv run ruff format ."
    - bash -c "cd client && npx --no-install oxlint --fix ."
  autofix_agent_fallback: true
  # Every gate here is static analysis whose mechanical fixer (ruff --fix /
  # oxlint --fix) already ran best-effort before an agent is ever spawned, so
  # what reaches an agent is a real code issue rather than formatting. That was
  # the argument for capping this at one: a second full agent respawn rarely
  # converts a still-failing lint gate, and re-pays a whole CLI run's usage.
  #
  # Measured against it: this is the cap that actually stops tickets here. Of 20
  # (ticket, stage) pairs that ever failed a transition gate, 15 reached two or
  # more failures — every one of those blocked for a human under a cap of one,
  # while the runaway backstop that was supposed to be the thing giving up had
  # never fired once in the life of the database. The organization and
  # silent-failure gates this workspace added since are also not lint: naming a
  # vocabulary or deciding how a failure surfaces is exactly the kind of thing a
  # second pass, holding the first pass's gate output, does convert.
  #
  # So three, matching the other bounded loops (MAX_REWORK_REROUTES, the CI
  # auto-fix limit). If the usage cost of the third pass turns out not to earn
  # its keep, the evidence for lowering it is the XPASS/fix rate of attempt 3,
  # not the argument above.
  autofix_max_agent_attempts: 3
subagents:
  spawn_via: cli
callbacks:
  mode: api
max_stages_per_run: 0
git:
  # Commit, and stop there. `enabled_steps` runs these as a chain and halts at
  # the first switch that is off, so leaving `push` off disables `open_pr` and
  # `auto_merge` regardless of their own flags — which is the intent, not an
  # oversight. This repository has no branch protection, so `gh pr merge --auto`
  # lands a PR immediately rather than on green; nothing here should publish
  # outward without a person deciding to.
  #
  # Without this, an acting chat turn wrote to its thread's worktree and stopped:
  # the work sat on `chat/<thread>` uncommitted, and the reply said so. Better
  # than the loose edits on `main` it replaced, but still a branch whose contents
  # only exist in a working tree. A commit is what makes it survivable.
  #
  # Reaches two callers, and only two — `chat_publish.publish_chat_turn` and
  # `parallel_run_service._publish_run_work`. The builtin orchestrator never
  # calls `git_automation` at all, so ordinary ticket stages are unaffected.
  commit: true
