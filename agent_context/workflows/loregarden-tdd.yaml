slug: loregarden-tdd
name: Loregarden TDD
description: >-
  Web/backend SDLC workflow adapted from loremaker — planner through gatekeeper
  with static QA and review stages. UI groups stages into planning/context/
  implementation/testing/review buckets.
stages:
  - key: plan
    name: Planning
    agent_id: planner
    skill_name: plan
    order: 1
  - key: context
    name: Context Gathering
    agent_id: retriever
    skill_name: ""
    order: 2
  - key: spec
    name: Specification
    agent_id: spec
    skill_name: ""
    order: 3
  - key: test-design
    name: Test Design
    agent_id: test_designer
    skill_name: ""
    order: 4
  - key: test-break
    name: Test Break
    agent_id: test_breaker
    skill_name: ""
    order: 5
  - key: implement
    name: Implementation
    agent_id: backend_implementer
    skill_name: ""
    order: 6
  - key: testing
    name: Testing
    agent_id: static_qa
    skill_name: ""
    order: 7
  - key: review
    name: Review Prep
    agent_id: gatekeeper
    skill_name: ""
    order: 8
  - key: approval
    name: Awaiting Approval
    agent_id: ""
    skill_name: ""
    optional: true
    order: 9
  - key: done
    name: Done
    agent_id: ""
    skill_name: ""
    order: 10
transitions:
  - from: plan
    to: context
  - from: context
    to: spec
  - from: spec
    to: test-design
  - from: test-design
    to: test-break
  - from: test-break
    to: implement
  - from: implement
    to: testing
  - from: testing
    to: review
    when: pass
  - from: testing
    to: implement
    when: reject
  - from: review
    to: approval
    when: pass
  - from: review
    to: implement
    when: reject
  - from: approval
    to: done
