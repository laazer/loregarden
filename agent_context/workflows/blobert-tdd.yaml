slug: blobert-tdd
name: Blobert TDD
description: >-
  Godot / Python / asset-pipeline TDD workflow for blobert — planner through AC
  gatekeeper with optional research, classify-based implementation routing, and
  parallel script review.
stages:
  - key: plan
    name: Planning
    agent_id: planner
    skill_name: plan
    order: 1
  - key: domain_consultation
    name: Research
    agent_id: retriever
    skill_name: ""
    optional: true
    order: 2
  - key: spec
    name: Specification
    agent_id: spec
    skill_name: ""
    order: 3
  - key: test-design
    name: Test Design
    agent_id: test_designer
    skill_name: ""
    order: 4
  - key: test-break
    name: Test Break
    agent_id: test_breaker
    skill_name: ""
    order: 5
  - key: implement
    name: Implementation
    agent_id: core_simulation
    skill_name: ""
    stage_type: classify
    order: 6
    stage_brief: >-
      Your run must end with no console errors or warnings, and you must say so with the
      evidence that shows it. The playtest gate no longer asks a human to watch the output
      for you.
    classify_routes:
      - specialties: ["simulation", "core", "deterministic"]
        agent_id: core_simulation
        skill_name: ""
      - specialties: ["gameplay", "mechanic", "combat", "fusion"]
        agent_id: gameplay_systems
        skill_name: ""
      - specialties: ["presentation", "ui", "hud", "audio", "vfx"]
        agent_id: presentation
        skill_name: ""
      - specialties: ["engine", "godot", "scene", "integration", "sandbox"]
        agent_id: engine_integration
        skill_name: ""
      - languages: ["typescript", "javascript"]
        specialties: ["frontend", "web", "editor", "asset"]
        agent_id: implementation_frontend
        skill_name: ""
      - agent_id: core_simulation
        skill_name: ""
        default: true
  - key: script_review
    name: Script Review
    agent_id: ""
    skill_name: ""
    stage_type: parallel
    order: 7
    stage_brief: >-
      Hunt regressions in the adjacent systems this change touches, not just defects in the
      lines it changed. That sweep used to be a bullet on the playtest checklist, where a
      human was asked to do it by eye after the fact; it is yours now.
    parallel_agents:
      - agent_id: gdscript_reviewer
        skill_name: ""
      - agent_id: static_qa
        skill_name: ""
      - agent_id: architecture_reviewer
        skill_name: ""
  - key: ac_gate
    name: AC Gate
    agent_id: ac_gatekeeper
    skill_name: ""
    stage_type: gate
    order: 8
  - key: playtest
    name: Playtest
    agent_id: ""
    skill_name: ""
    optional: true
    order: 9
    checklist:
      - "{{playtest_scenes}}"
      - "{{ticket_intent}}"
  - key: learning
    name: Learning
    agent_id: learning
    skill_name: ""
    optional: true
    order: 10
  - key: done
    name: Done
    agent_id: ""
    skill_name: ""
    order: 11
transitions:
  - from: plan
    to: domain_consultation
  - from: domain_consultation
    to: spec
  - from: spec
    to: test-design
  - from: test-design
    to: test-break
  - from: test-break
    to: implement
  - from: implement
    to: script_review
  - from: script_review
    to: ac_gate
    when: pass
  - from: script_review
    to: implement
    when: reject
  - from: ac_gate
    to: playtest
    when: pass
  - from: ac_gate
    to: implement
    when: reject
  - from: test-design
    to: spec
    when: reject
  - from: test-break
    to: spec
    when: reject
  - from: playtest
    to: learning
    when: pass
  - from: playtest
    to: implement
    when: reject
  - from: learning
    to: done
