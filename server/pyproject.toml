[project]
name = "loregarden-server"
version = "0.1.0"
description = "Loregarden control plane — agent SDLC orchestration"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlmodel>=0.0.22",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "pyyaml>=6.0.2",
    # Round-trip YAML for orchestration profiles. PyYAML's loader discards
    # comments, so saving a profile from the UI erased the prose explaining why
    # its gate policy is what it is — see orchestration_profile._load_yaml.
    "ruamel.yaml>=0.18.6",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-xdist>=3.6.0",
    "ruff>=0.9.0",
    # Pre-commit: function size (too-many-statements / R0915); see [tool.pylint].
    "pylint>=3.3",
    # Pre-commit: mypy on staged server files (see [tool.mypy]).
    "mypy>=1.14",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-xdist>=3.6.0",
    "ruff>=0.9.0",
    "pylint>=3.3",
    "mypy>=1.14",
]
# Only pulled in by scripts/build-backend.sh when packaging the desktop
# sidecar — not part of the default dev sync, so `uv run`/tests stay fast.
build = [
    "pyinstaller>=6.11.0",
]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["loregarden"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "real_shell_command: opt out of the plain-shell patch and see the real argv",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["loregarden"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort, UP: pyupgrade, B: bugbear, C4: comprehensions
# C901 (McCabe) is *not* in select — 50+ pre-existing hits. Growth is gated by the
# diff-scoped py-complexity pre-commit hook (ruff_complexity_diff_filter.py).
select = ["E", "W", "F", "I", "UP", "B", "C4"]
ignore = [
    "E501",  # line length handled by the formatter, not enforced as a lint error
    "B008",  # FastAPI dependency-injection idiom relies on calls in defaults
    "E712",  # `Column == True/False` is SQLAlchemy/SQLModel filter syntax, not a bug;
             # `is True` would break query building since `is` can't be overloaded
]

[tool.ruff.lint.mccabe]
# Used by py-complexity (Ruff C901). Default is 10; keep it explicit.
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "E402"]

[tool.pylint.main]
disable = ["all"]
enable = ["too-many-statements"]

[tool.pylint.design]
max-statements = 50

# Gradual typing: staged-file hook only. Existing call-site / annotation debt is
# large; this starter gate fails on definite name/import breaks, not arg-type
# noise. Tighten disable_error_code as modules get annotated.
[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = true
check_untyped_defs = false
allow_untyped_defs = true
allow_incomplete_defs = true
no_implicit_optional = false
disable_error_code = [
    "arg-type",
    "assignment",
    "attr-defined",
    "call-arg",
    "return-value",
    "union-attr",
    "var-annotated",
    "index",
    "operator",
    "list-item",
    "dict-item",
    "typeddict-item",
    "override",
    "misc",
    "type-arg",
    "valid-type",
    "import-untyped",
    "no-any-return",
    "no-untyped-def",
    "no-untyped-call",
]
exclude = [
    "tests/",
    "^.*/migrations(_.*)?\\.py$",
]
