[project]
name = "loregarden-server"
version = "0.1.0"
description = "Loregarden control plane — agent SDLC orchestration"
requires-python = ">=3.11"  # StrEnum; see [tool.mypy] python_version
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlmodel>=0.0.22",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "pyyaml>=6.0.2",
    # Round-trip YAML for orchestration profiles. PyYAML's loader discards
    # comments, so saving a profile from the UI erased the prose explaining why
    # its gate policy is what it is — see orchestration_profile._load_yaml.
    "ruamel.yaml>=0.18.6",
    "httpx>=0.27.0",
    "trafilatura>=2.0",
    "python-multipart>=0.0.9",
]

# The entry point for anything outside this repo — another service, a cron job, an MCP
# client that can only launch a command. One command with subcommands, so callers stay off
# module paths (`python -m loregarden.cli.*`), which are an internal layout detail.
[project.scripts]
loregarden = "loregarden.cli.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-xdist>=3.6.0",
    "ruff>=0.9.0",
    # Pre-commit: function size (too-many-statements / R0915); see [tool.pylint].
    "pylint>=3.3",
    # Pre-commit: mypy on staged server files (see [tool.mypy]).
    "mypy>=1.14",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-xdist>=3.6.0",
    "ruff>=0.9.0",
    "pylint>=3.3",
    "mypy>=1.14",
]
# Only pulled in by scripts/build-backend.sh when packaging the desktop
# sidecar — not part of the default dev sync, so `uv run`/tests stay fast.
build = [
    "pyinstaller>=6.11.0",
]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["loregarden"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "real_shell_command: opt out of the plain-shell patch and see the real argv",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["loregarden"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort, UP: pyupgrade, B: bugbear, C4: comprehensions
# C901 (McCabe) is *not* in select — 50+ pre-existing hits. Growth is gated by the
# diff-scoped py-complexity pre-commit hook (ruff_complexity_diff_filter.py).
select = ["E", "W", "F", "I", "UP", "B", "C4"]
ignore = [
    "E501",  # line length handled by the formatter, not enforced as a lint error
    "B008",  # FastAPI dependency-injection idiom relies on calls in defaults
    "E712",  # `Column == True/False` is SQLAlchemy/SQLModel filter syntax, not a bug;
             # `is True` would break query building since `is` can't be overloaded
]

[tool.ruff.lint.mccabe]
# Used by py-complexity (Ruff C901). Default is 10; keep it explicit.
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "E402"]

[tool.pylint.main]
disable = ["all"]
enable = ["too-many-statements"]

[tool.pylint.design]
max-statements = 50

# Gradual typing: staged-file hook only. Existing call-site / annotation debt is
# large; this starter gate fails on definite name/import breaks, not arg-type
# noise. Tighten disable_error_code as modules get annotated.
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = true
check_untyped_defs = false
allow_untyped_defs = true
allow_incomplete_defs = true
no_implicit_optional = false
# Measured against the tree at 7725068, every code re-enabled, python_version
# corrected to 3.11 (547). 425 errors became 202 on the version fix alone: more
# than half of what looked like type debt was mypy reading this code against a
# Python it cannot run on. Eleven codes then had zero errors and are back on;
# `return-value` had seven, all real, all fixed here.
#
# What is still off, with its measured cost. Re-enable by fixing the count, not
# by deleting the line:
#
#   attr-defined  72   mostly SQLModel column attributes on model classes
#   arg-type      51
#   union-attr    28
#   assignment    22
#   operator       7
#   misc           4
#   dict-item      4
#   index          1
#
# Anything not listed here is enabled. `return-value` is the one that matters
# most to keep: without it `def f() -> int: return "no"` type-checks clean, and
# every "mypy clean" in a stage report meant less than its reader thought.
disable_error_code = [
    "arg-type",
    "assignment",
    "attr-defined",
    "union-attr",
    "index",
    "operator",
    "dict-item",
    "misc",
]
exclude = [
    "tests/",
    "^.*/migrations(_.*)?\\.py$",
]
