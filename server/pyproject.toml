[project]
name = "loregarden-server"
version = "0.1.0"
description = "Loregarden control plane — agent SDLC orchestration"
requires-python = ">=3.11"  # StrEnum; see [tool.mypy] python_version
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlmodel>=0.0.22",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "pyyaml>=6.0.2",
    # Round-trip YAML for orchestration profiles. PyYAML's loader discards
    # comments, so saving a profile from the UI erased the prose explaining why
    # its gate policy is what it is — see orchestration_profile._load_yaml.
    "ruamel.yaml>=0.18.6",
    "httpx>=0.27.0",
    "trafilatura>=2.0",
    "python-multipart>=0.0.9",
    "lore-eden",
    "send2trash>=1.8.3",
]

# The entry point for anything outside this repo — another service, a cron job, an MCP
# client that can only launch a command. One command with subcommands, so callers stay off
# module paths (`python -m loregarden.cli.*`), which are an internal layout detail.
[project.scripts]
loregarden = "loregarden.cli.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-xdist>=3.6.0",
    # Per-test wall-clock ceiling; see [tool.pytest.ini_options] for the value
    # and why a hang needs catching rather than waiting out.
    "pytest-timeout>=2.3.0",
    # One warm rerun for a test over the per-test ceiling, and nothing else
    # (tests/slow_test_ceiling.py): a single noisy CI timing must not fail a build.
    "pytest-rerunfailures>=15",
    "ruff>=0.9.0",
    # Pre-commit: function size (too-many-statements / R0915); see [tool.pylint].
    "pylint>=3.3",
    # Pre-commit: mypy on staged server files (see [tool.mypy]).
    "mypy>=1.14",
    # `task mutation` (see [tool.mutmut]). Pinned exactly: the driver sets
    # per-run config through mutmut internals and refuses any other version.
    "mutmut==3.8.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-xdist>=3.6.0",
    "pytest-timeout>=2.3.0",
    "ruff>=0.9.0",
    "pylint>=3.3",
    "mypy>=1.14",
    "mutmut==3.8.1",
    "pytest-rerunfailures>=15",
]
# Only pulled in by scripts/build-backend.sh when packaging the desktop
# sidecar — not part of the default dev sync, so `uv run`/tests stay fast.
build = [
    "pyinstaller>=6.11.0",
]

[tool.uv.sources]
# Local instances (`services/local_instances.py`) run on lore-eden's launcher,
# registry and router. Pinned to a commit on its main: lore-eden is consumed unpublished
# while its API settles (its CONTRIBUTING, rule 3), and a moving branch would
# change what this server runs without a commit here saying so.
lore-eden = { git = "https://github.com/laazer/lore-eden", subdirectory = "python", rev = "a2755e0c7fdce9db7a712ebc1618cddae777fa93" }

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["loregarden"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Keep scratch only for tests that failed. The default keeps every run's
# `tmp_path` tree, and `_pytest.pathlib.LOCK_TIMEOUT` is three DAYS — a run that
# is killed rather than exiting cleanly never removes its lock, so its directory
# is protected for that long. On 2026-09-03 this machine held 72 run
# directories, ~71 GiB, and a full suite failed with 1463 errors that were all
# `database or disk is full` rather than anything in the code. Passing tests do
# not need their scratch kept.
tmp_path_retention_policy = "failed"
markers = [
    "real_shell_command: opt out of the plain-shell patch and see the real argv",
    "registry: a fast whole-tree check run on pre-commit (.lefthook/scripts/registry-checks.sh)",
]
# A hung test used to be indistinguishable from a slow suite. Nothing capped a
# test's wall clock, so a deadlock presented as a full run that never returned —
# and this suite legitimately takes ~44 minutes for ~4,770 tests, which is long
# enough that "it is still going" was never evidence either way. On 2026-09-11 a
# healthy run was suspected hung for 25 minutes before `ps` settled it.
#
# 120s is ~12x the slowest test measured on that run (9.55s, the top 20 all
# between 5s and 10s). That margin is deliberate: load moves these numbers, and
# a ceiling tight enough to flake under contention is worse than no ceiling,
# since it teaches everyone to re-run. A hang is unbounded, so detecting it in
# two minutes rather than one costs nothing worth having.
#
# `signal` over the default `thread`: SIGALRM fails the one test, dumps its
# stack, and lets the remaining suite run, where the thread method kills the
# whole process and loses every result after the hang. The trade is that a test
# blocked inside a C call that holds the GIL will not be interrupted — in this
# suite the realistic hangs are socket reads, subprocess waits and lock
# acquisitions, all of which SIGALRM does interrupt.
timeout = 120
timeout_method = "signal"

# Mutation-testing PILOT (lg-build-verification-2639). Scoped to ONE module on
# purpose: this measures what a mutation gate would cost, it is not a gate.
# Nothing in lefthook.yml or the orchestration profiles runs it — `task
# mutation:server` does, under the capacity ledger.
#
# Changed-lines mutation testing (`task mutation`, .lefthook/scripts/mutation_changed_lines.py)
# shares this table's `source_paths` and `process_isolation` and overrides the
# per-run fields (`only_mutate`, `pytest_add_cli_args_test_selection`,
# `pytest_add_cli_args`, `also_copy`, `mutate_only_covered_lines`) in-process
# in `.lefthook/scripts/mutmut_driver.py`, while `run-server.sh` runs the bare
# `mutmut` CLI directly and reads this table as-is.
#
# mutmut reads this from the CWD, so it must be run from `server/`
# (configuration.py:_config_reader), and it mutates a COPY at `server/mutants/`
# (runners/harness.py, change_cwd("mutants")) — never the working tree.
[tool.mutmut]
# WHAT IS MUTATED is `only_mutate`: the ONE pilot module. A second path there
# is a second pilot.
#
# WHAT IS COPIED is `source_paths`, and it must be the whole importable
# package. mutmut's `copy_src_dir` copies exactly what source_paths names into
# server/mutants/, and `setup_source_paths` then puts mutants/ on sys.path and
# REMOVES the real source directory, so that the tests cannot reach unmutated
# code. Naming a single FILE here therefore produced a sandbox holding 1 of
# loregarden's 934 modules, and the run died in mutmut's baseline at
# `ModuleNotFoundError: No module named 'loregarden.config'` while importing
# server/tests/conftest.py — before any mutant was tested, so no .meta, no
# kill matrix and no score.
#
# The scoping that AC-1 asks for lives in `only_mutate`, which is the key
# mutmut provides for it: `walk_mutatable_files` keeps only paths matching it
# (configuration.py should_mutate), so the copy is the whole package and the
# mutation is the one file.
source_paths = ["loregarden"]
only_mutate = ["loregarden/services/integration_merge_budget.py"]

# The module's own directly-covering tests, measured and recorded in the
# `Mutation pilot — module selection` artifact. mutmut appends these as the
# pytest test selection (configuration.py:155).
#
# EVERY FILE HERE MUST PASS FROM server/mutants/, not just from server/.
# mutmut copies the tree and runs pytest with cwd=mutants, so a test that
# resolves a path from its own __file__ resolves it one directory deeper and
# reads something that is not there. That failure lands in mutmut's BASELINE
# run, before a single mutant is tested, so there is no .meta and no kill
# matrix at all — the whole campaign produces nothing. Check a change to this
# list with `bash scripts/mutation/run-server.sh --check-selection`, which
# runs exactly these files from the sandbox and names any that cannot.
#
# tests/test_queue_slot_claims.py is DELIBERATELY ABSENT. It covers
# queue_lanes.py, and 38 of its 47 tests pass in the sandbox, but 9 do not:
# it sets REPO_ROOT = Path(__file__).resolve().parents[2] (line 32), which
# from server/mutants/tests/ is server/ rather than the repo root, so its
# source-reading assertions open server/server/loregarden/services/*.py and
# raise FileNotFoundError. Measured: 9 failed, 38 passed from the sandbox,
# against 81 passed for the other five files.
#
# Dropping it is not free and the review list must say so: those 9 tests
# assert on SOURCE TEXT — that a constant is defined once, that a predicate
# is not duplicated, that no caller writes the grace window out by hand.
# Mutation testing cannot evaluate a test like that in the first place,
# because mutmut's operators change behaviour and these assertions read
# characters. They belong to the class this pilot already names: tests that
# guard something no operator can reach. Their absence from the kill matrix
# is a stated limit of the measurement, not evidence about them.
pytest_add_cli_args_test_selection = [
    "tests/test_integration_merge_budget.py",
]

pytest_add_cli_args = [
    "-p",
    "no:cacheprovider",
    # The AC-6 kill matrix. mutmut's own test-level data is COVERAGE — a map
    # of tests by mangled function name — and never kills; substituting it
    # omits exactly the tests that touch the code and assert nothing. A test
    # scans for that map's name here, so it is described rather than spelled.
    "-p",
    "mutmut_killers",
    # REQUIRED FOR CORRECTNESS, not for speed, and not a slow default to
    # delete. mutmut forces `-x` at runners/harness.py:140 and appends this
    # list after it (line 128). `-x` is store_const const=1 dest=maxfail, and
    # `--maxfail=0` writes the same dest, so the later value wins. Keeping
    # `-x` would record only the first killer of each mutant, so a test that
    # really killed something is listed as having killed nothing — a false
    # "delete this test", the most expensive output this pilot can produce.
    # It is also the dominant cost term; AC-12 carries it as the fixed cost of
    # having a kill matrix at all.
    "--maxfail=0",
]

# The plugin must be IN the sandbox as well as loaded: pytest runs with
# cwd=mutants, so a `-p mutmut_killers` with no copied module fails the run.
#
# It MUST be a bare top-level filename, and it must exist relative to THIS
# directory when mutmut runs. Three constraints in mutmut 3.8.1 force that,
# all read at source in utils/file_utils.py:
#
#   1. `copy_also_copy_files` resolves each entry against mutmut's CWD, which
#      is server/ (where this file is). The repo's scripts/ is at the REPO
#      root, so "scripts/mutation/mutmut_killers.py" named a path that does
#      not exist from here.
#   2. That function's miss is `if not path.exists(): continue` — a SILENT
#      skip. Nothing warned; the run died later at `-p mutmut_killers` with
#      "No module named 'mutmut_killers'", which names the symptom and not
#      the cause.
#   3. It copies with `shutil.copy2` and never mkdirs the destination parent,
#      so even a nested path that DID exist raises FileNotFoundError on
#      'mutants/scripts/...'. And `setup_source_paths` puts only mutants/
#      (plus mutants/src, mutants/source) on sys.path, so `-p mutmut_killers`
#      can resolve nothing but a TOP-LEVEL module in the sandbox.
#
# So run-server.sh stages scripts/mutation/mutmut_killers.py to
# server/mutmut_killers.py before the run and removes it after, and this key
# names that staged copy. run-server.sh also asserts the file reached
# mutants/ before trusting the run, because a silent skip here produces a
# review list that is empty rather than an error anybody sees.
also_copy = ["mutmut_killers.py"]

# This suite reaches deep call stacks through the orchestrator; 8 keeps the
# trampoline's bookkeeping bounded without cutting the pilot module's own
# frames out of the picture.
max_stack_depth = 8

# Do not pay for mutants no test can reach. They land in `no tests`, which is
# a category the reducer already reports separately from `survived`.
mutate_only_covered_lines = true

# Not "fork": that forks every session from the process that already ran the
# stats pass, so its imports leak into the clean run and every mutant. Measured:
# test_migration_registry imports a package from its tmp_path, pytest deletes
# passing tests' tmp dirs (tmp_path_retention_policy), and the clean run then
# found the cached module pointing at nothing — a red baseline on green code.
# A fork server only collects, so each session starts from collection alone.
process_isolation = "forkserver"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["loregarden"]

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: isort, UP: pyupgrade, B: bugbear, C4: comprehensions
# BLE: blind-except, TRY: tryceratops, S110/S112: try-except-pass / -continue.
# C901 (McCabe) is *not* in select — 50+ pre-existing hits. Growth is gated by the
# diff-scoped py-complexity pre-commit hook (ruff_complexity_diff_filter.py).
#
# BLE/TRY/S11x were added after the silent-failure audit found 23 `# noqa: BLE001`
# comments in the tree suppressing a rule that had never been enabled — the
# codebase believed blind-except was gated for years while nothing checked it.
#
# DTZ002-006/011: a naive clock read (`datetime.now()`, `utcnow()`, `today()`).
# Stored timestamps are UTC (`models.domain.enums.utcnow`); a naive local read
# lands in the same column looking identical, hours off. Zero hits when enabled;
# DTZ001/DTZ901 (constructors, min/max) are left out as unrelated.
select = [
    "E", "W", "F", "I", "UP", "B", "C4", "BLE", "TRY", "S110", "S112",
    "DTZ002", "DTZ003", "DTZ004", "DTZ005", "DTZ006", "DTZ011",
]
ignore = [
    "E501",  # line length handled by the formatter, not enforced as a lint error
    "B008",  # FastAPI dependency-injection idiom relies on calls in defaults
    "E712",  # `Column == True/False` is SQLAlchemy/SQLModel filter syntax, not a bug;
             # `is True` would break query building since `is` can't be overloaded
    # The TRY family is selected for the sub-rules that bear on observability
    # (TRY400 error-instead-of-exception, TRY401 verbose-log-message, and BLE001
    # alongside it). The rest are message/placement style with no bearing on
    # whether a failure is visible, and carry heavy pre-existing debt:
    "TRY003",  # long messages outside the exception class — 471 hits, pure style
    "TRY300",  # "consider else block" — placement, not observability
    "TRY301",  # "raise within try" — placement, not observability
    "TRY004",  # prefer TypeError for type checks — unrelated to silent failure
]

[tool.ruff.lint.mccabe]
# Used by py-complexity (Ruff C901). Default is 10; keep it explicit.
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# BLE/S110/S112: a suite proves enforcement by provoking a failure and swallowing
# it — `except Exception: pass` around a write the database is supposed to refuse
# IS the assertion. py_silent_except_check.py exempts tests for the same reason.
"tests/*" = ["B", "E402", "BLE", "S110", "S112"]

[tool.pylint.main]
disable = ["all"]
enable = ["too-many-statements"]

[tool.pylint.design]
max-statements = 50

# Gradual typing: staged-file hook only. Existing call-site / annotation debt is
# large; this starter gate fails on definite name/import breaks, not arg-type
# noise. Tighten disable_error_code as modules get annotated.
[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = true
check_untyped_defs = false
allow_untyped_defs = true
allow_incomplete_defs = true
no_implicit_optional = false
# Measured against the tree at 7725068, every code re-enabled, python_version
# corrected to 3.11 (547). 425 errors became 202 on the version fix alone: more
# than half of what looked like type debt was mypy reading this code against a
# Python it cannot run on. Eleven codes then had zero errors and are back on;
# `return-value` had seven, all real, all fixed here.
#
# What is still off, with its measured cost. Re-enable by fixing the count, not
# by deleting the line:
#
#   attr-defined  72   mostly SQLModel column attributes on model classes
#   arg-type      51
#   union-attr    28
#   assignment    22
#   operator       7
#   misc           4
#   dict-item      4
#   index          1
#
# Anything not listed here is enabled. `return-value` is the one that matters
# most to keep: without it `def f() -> int: return "no"` type-checks clean, and
# every "mypy clean" in a stage report meant less than its reader thought.
disable_error_code = [
    "arg-type",
    "assignment",
    "attr-defined",
    "union-attr",
    "index",
    "operator",
    "dict-item",
    "misc",
]
exclude = [
    "tests/",
    "^.*/migrations(_.*)?\\.py$",
]
